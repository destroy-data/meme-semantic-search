# Opus 5 przez lokalne CLI Claude Code (subskrypcja, bez klucza API).
# Reszta jak w config.toml, więc opisy lądują w tej samej bazie obok grokowych.
db_path = "memes.db"
image_dir = "/home/marcin/internet"
phash_threshold = 8

[describe]
backend = "claude-code-cli"  # spawn `claude --print` instead of POSTing to base_url
model = "claude-opus-5-5"  # passed to --model; "opus" alias works too
prompt_version = "vcli1"
effort_level = "xhigh"   # passed to --effort: low | medium | high | xhigh | max

[embed]
base_url = "http://localhost:2138/v1"
api_key = "ollama"
model = "bge-m3"
